version: '3.8'

services:
  tendergo-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1401:1433"
    networks:
      - tendergo-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - tendergo-sql-data:/var/opt/mssql
  
  tendergo-rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
      - RABBITMQ_VM_MEMORY_HIGH_WATERMARK_RELATIVE=0.6
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - tendergo-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    volumes:
      - tendergo-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tendergo-subscriber:
    build:
      context: .
      dockerfile: DockerfileSubscriber
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      - ConnectionStrings__RabbitMQ=${ConnectionStrings__RabbitMQ}
      - RabbitMQ__Host=tendergo-rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
    depends_on:
      tendergo-rabbitmq:
        condition: service_healthy
      tendergo-sql:
        condition: service_healthy
    networks:
      - tendergo-network

  tendergo-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: DockerfileApi
    env_file:
      - .env
    environment:
      - DOTNET_RUNNING_IN_CONTAINER=true
      - ASPNETCORE_ENVIRONMENT=Production
      - RabbitMQ__Host=tendergo-rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    depends_on:                      
      tendergo-sql:
        condition: service_healthy
      tendergo-rabbitmq:
        condition: service_healthy
    networks:
      - tendergo-network  

networks:
  tendergo-network:
    driver: bridge

volumes:
  tendergo-sql-data:
  tendergo-rabbitmq-data:
